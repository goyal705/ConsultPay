{% extends "base.html" %}
{% block title %}Login · ConsultPay{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Login</h2>
  {% for err in form.non_field_errors() %}<p class="error">{{ err }}</p>{% endfor %}
  <form method="post">
    {{ csrf_input }}
    <label>Username <input name="username" value="{{ form.data.get('username', '') }}" required autofocus></label>
    <label>Password <input type="password" name="password" required></label>
    <button class="btn">Login</button>
  </form>
  <p class="muted">No account? <a href="{{ url('web:register') }}">Register</a></p>
</div>
{% endblock %}
